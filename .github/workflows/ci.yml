name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: forge test (contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned Foundry dependencies
        run: ./install-deps.sh
      - name: Run contract tests
        run: forge test -vvv
      - name: Build and enforce size limits
        run: forge build --sizes
      - name: Verify current deployed treasury creation-code commitment
        shell: bash
        run: |
          set -euo pipefail
          artifact="out/FairWitnessTreasury.sol/FairWitnessTreasury.json"
          manifest="deployments/controlled-demo-schema-v1-lifecycle.json"
          bytecode=$(jq -r '.bytecode.object' "$artifact")
          actual_hash=$(cast keccak "$bytecode")
          expected_hash=$(jq -r '.destination.treasuryCreationCode.hash' "$manifest")
          actual_size=$(( (${#bytecode} - 2) / 2 ))
          expected_size=$(jq -r '.destination.treasuryCreationCode.size' "$manifest")
          echo "creation code hash: $actual_hash"
          echo "creation code size: $actual_size"
          test "${actual_hash,,}" = "${expected_hash,,}"
          test "$actual_size" -eq "$expected_size"
      - name: Reject stale committed client ABIs
        run: |
          node script/update-abis.js
          git diff --exit-code -- ../agent/src/abi ../frontend/src/abi

  agent:
    name: vitest (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    name: test, lint and build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  release-audit:
    name: release documentation and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current release references agree
        run: node scripts/check-release-consistency.mjs
      - name: Require release source-of-truth files and complete handoff chain
        run: |
          test -f master_instruction.md
          test -f docs/RELEASE_AUDIT.md
          test -f docs/architecture/ARCHITECTURE_LOCK.md
          test -f contracts/deployments/controlled-demo-schema-v1-lifecycle.json
          test -f docs/PRE_SUBMISSION_CHECKLIST.md
          for phase in $(seq 1 13); do
            test -f "docs/handoffs/PHASE_${phase}_HANDOFF.md"
          done
      - name: Reject tracked private environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "Tracked private environment file detected"
            exit 1
          fi
      - name: Reject public email persistence in user_instances
        run: |
          if grep -RniE '\bemail\b' frontend/src/lib/instanceStore.ts frontend/supabase/migrations/0001_user_instances.sql | grep -vE 'do not store|NOT persisted|email is not|required'; then
            echo "Public instance projection still appears to persist email"
            exit 1
          fi
