name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: forge test (contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # lib/ is committed as plain files (no submodules), so no `forge install` needed.
      - run: forge test -vvv
      - run: forge build --sizes

  agent:
    name: vitest (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    name: test, lint and build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  release-audit:
    name: release documentation and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require release source-of-truth files and complete handoff chain
        run: |
          test -f master_instruction.md
          test -f docs/RELEASE_AUDIT.md
          test -f docs/architecture/ARCHITECTURE_LOCK.md
          test -f contracts/deployments/controlled-demo-schema-v1.json
          for phase in $(seq 1 13); do
            test -f "docs/handoffs/PHASE_${phase}_HANDOFF.md"
          done
      - name: Reject tracked private environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "Tracked private environment file detected"
            exit 1
          fi
