[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
# NOTE: the previous build session pinned `solc` to a manually-downloaded binary
# (/root/.solc/solc-0.8.24) because that sandbox could not reach binaries.soliditylang.org.
# That path does not exist on this machine and the network here is unrestricted, so the
# pin is removed and forge auto-manages the solc version (see DEVLOG.md).
solc = "0.8.24"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]
