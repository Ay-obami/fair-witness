[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
# Pinned to a manually-downloaded solc binary — see DEVLOG.md "Pitfall: solc auto-download
# blocked in sandbox". A real dev machine with normal network access does not need this
# override; forge will auto-manage solc versions as usual.
solc = "/root/.solc/solc-0.8.24"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]
